<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Ramchandra's Digital Store</title>

    <link rel="stylesheet" href="checkout.css">
</head>

<body>

    <header>
        <h1>🛒 Checkout</h1>

        <a href="index.html">← Back to Store</a>
    </header>


    <main>

        <section class="checkout-container">

            <div class="customer-section">

                <h2>Customer Details</h2>

                <form id="checkout-form">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >


                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="House number, street, village/town"
                        required
                    ></textarea>


                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >


                    <label for="pin">
                        PIN Code
                    </label>

                    <input
                        type="text"
                        id="pin"
                        placeholder="Enter PIN code"
                        maxlength="6"
                        required
                    >


                    <h2>Payment Method</h2>

                    <div class="payment-options">

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="cod"
                                checked
                            >

                            Cash on Delivery
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="online"
                            >

                            Online Payment
                        </label>

                    </div>


                    <button
                        type="submit"
                        id="place-order"
                    >
                        Place Order
                    </button>

                </form>

            </div>


            <div class="order-section">

                <h2>Order Summary</h2>

                <div id="checkout-items"></div>

                <div class="checkout-total">

                    Total:

                    ₹<span id="checkout-total">0</span>

                </div>

            </div>

        </section>

    </main>


    <script src="checkout.js"></script>

</body>

</html>
